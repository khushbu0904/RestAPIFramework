name: Selenium UI tests
on:
  push:
    paths: ['selenium-framework/**']
  pull_request:
    paths: ['selenium-framework/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selenium-framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: browser-actions/setup-chrome@v1
      - name: Run tests
        run: mvn -B clean test -Dheadless=true
      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-artifacts
          path: |
            selenium-framework/target/surefire-reports/
            selenium-framework/target/screenshots/
          if-no-files-found: ignore